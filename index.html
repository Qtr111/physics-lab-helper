<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验助手 🔬</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔬 物理实验助手</h1>
        <p>你的专属AI物理实验导师已就位！</p>
        <p>👆 点击右下角聊天按钮开始对话</p>
        <br>
        <p><strong>可以问我：</strong></p>
        <ul>
            <li>实验设计与方案</li>
            <li>数据处理与分析</li>
            <li>误差来源分析</li>
            <li>实验注意事项</li>
        </ul>
    </div>

    <!-- 引入Chat SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/latest/libs/cn/index.js"></script>

    <script>
        new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7640388575573852169',  // 你的Bot ID
            },
            auth: {
                type: 'unauth',  // 无鉴权模式测试
            },
            componentProps: {
                title: '物理实验助手 🔬',
            },
            ui: {
                chatBot: {
                    title: '物理实验助手 🔬',
                    uploadable: true,
                }
            }
        });
    </script>
</body>
</html>
