<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验助手</title>
    <style>
        /* 悬浮按钮 */
        #floatBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 9999;
            font-size: 28px;
        }

        /* 对话框 - 默认隐藏 */
        #chatBox {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            z-index: 9998;
            display: none; /* 关键：默认隐藏 */
            overflow: hidden;
        }

        /* 显示时的样式 */
        #chatBox.show {
            display: block !important;
        }

        /* 标题栏 */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
        }
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* iframe */
        #chatBox iframe {
            width: 100%;
            height: calc(100% - 55px);
            border: none;
        }

        /* 手机适配 */
        @media (max-width: 500px) {
            #chatBox {
                width: calc(100% - 40px);
                height: 70vh;
                right: 20px;
            }
            #floatBtn {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 悬浮按钮 -->
    <div id="floatBtn" onclick="toggleChat()">💬</div>

    <!-- 对话框 -->
    <div id="chatBox">
        <div class="chat-header">
            <span><strong>🔬 物理实验助手</strong></span>
            <button class="close-btn" onclick="toggleChat()">×</button>
        </div>
        <iframe src="https://code.coze.cn/p/7640388575573852169/preview"></iframe>
    </div>

    <script>
        // 最简单的切换函数
        function toggleChat() {
            var chatBox = document.getElementById('chatBox');
            
            // 直接切换显示/隐藏
            if (chatBox.style.display === 'block') {
                chatBox.style.display = 'none';
            } else {
                chatBox.style.display = 'block';
            }
            
            // 控制台输出，方便调试
            console.log('点击了！当前状态:', chatBox.style.display);
        }

        // 页面加载完成后输出日志
        window.onload = function() {
            console.log('页面加载完成');
            console.log('悬浮按钮:', document.getElementById('floatBtn'));
            console.log('对话框:', document.getElementById('chatBox'));
        }
    </script>

</body>
</html>
