<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        /* ========== 悬浮按钮 ========== */
        .chat-float-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.4);
            z-index: 9999;
            transition: all 0.3s ease;
            font-size: 30px;
        }
        .chat-float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        /* ========== 对话框 ========== */
        .chat-modal {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 420px;
            height: 650px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 50px rgba(0,0,0,0.25);
            z-index: 9998;
            display: none;
            overflow: hidden;
        }
        .chat-modal.active {
            display: block;
            animation: popUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popUp {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 对话框标题栏 */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            font-size: 17px;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .close-chat {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-chat:hover {
            background: rgba(255,255,255,0.35);
        }

        /* iframe */
        .chat-frame {
            width: 100%;
            height: calc(100% - 65px);
            border: none;
        }

        /* 移动端适配 */
        @media (max-width: 500px) {
            .chat-modal {
                width: calc(100% - 30px);
                height: 80vh;
                right: 15px;
                bottom: 90px;
            }
            .chat-float-btn {
                right: 20px;
                bottom: 20px;
                width: 56px;
                height: 56px;
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <!-- 悬浮聊天按钮 -->
    <div class="chat-float-btn" onclick="openChat()" title="点击对话">
        💬
    </div>

    <!-- 聊天对话框 -->
    <div class="chat-modal" id="chatModal">
        <div class="chat-header">
            <h3>🔬 物理实验助手</h3>
            <button class="close-chat" onclick="closeChat()">×</button>
        </div>
        <iframe 
            class="chat-frame"
            src="https://code.coze.cn/p/7640388575573852169/preview"
            loading="lazy"
        ></iframe>
    </div>

    <script>
        const chatModal = document.getElementById('chatModal');

        function openChat() {
            chatModal.classList.add('active');
        }

        function closeChat() {
            chatModal.classList.remove('active');
        }

        // 点击按钮切换
        document.querySelector('.chat-float-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (chatModal.classList.contains('active')) {
                closeChat();
            } else {
                openChat();
            }
        });

        // 点击其他地方关闭
        document.addEventListener('click', function(e) {
            if (!chatModal.contains(e.target) && 
                !e.target.closest('.chat-float-btn')) {
                closeChat();
            }
        });
    </script>
</body>
</html>
