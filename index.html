<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验助手 🔬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        ul {
            line-height: 2;
            margin-left: 20px;
        }

        /* ========== 悬浮按钮样式 ========== */
        .chat-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 9999;
            transition: transform 0.3s;
            font-size: 28px;
        }
        .chat-btn:hover {
            transform: scale(1.1);
        }

        /* ========== 对话框样式 ========== */
        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            z-index: 9998;
            display: none; /* 默认隐藏 */
            overflow: hidden;
        }
        .chat-window.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 对话框标题栏 */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            font-size: 16px;
            font-weight: 600;
        }
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* iframe */
        .chat-window iframe {
            width: 100%;
            height: calc(100% - 56px);
            border: none;
        }

        /* 移动端适配 */
        @media (max-width: 500px) {
            .chat-window {
                width: calc(100% - 40px);
                height: 70vh;
                right: 20px;
                bottom: 90px;
            }
            .chat-btn {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 你的主页内容 -->
    <div class="card">
        <h1>🔬 物理实验助手</h1>
        <p style="font-size: 18px; margin-bottom: 30px;">
            你的专属AI物理实验导师已就位！
        </p>
        
        <h3 style="margin-bottom: 15px;">📚 我可以帮你：</h3>
        <ul>
            <li>✅ 设计实验方案与步骤</li>
            <li>✅ 处理实验数据与分析结果</li>
            <li>✅ 讲解误差来源与改进方法</li>
            <li>✅ 解答实验原理和注意事项</li>
            <li>✅ 指导实验报告撰写</li>
        </ul>
        
        <br>
        <p style="text-align: center; font-size: 18px;">
            💬 点击右下角的聊天按钮开始对话！
        </p>
    </div>

    <!-- 悬浮按钮 -->
    <div class="chat-btn" onclick="toggleChat()" title="点击开始对话">
        💬
    </div>

    <!-- 对话框 -->
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <h3>🔬 物理实验助手</h3>
            <button class="close-btn" onclick="toggleChat()">×</button>
        </div>
        <iframe src="https://code.coze.cn/p/7640388575573852169/preview"></iframe>
    </div>

    <script>
        // 切换对话框显示/隐藏
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.classList.toggle('show');
        }
    </script>
</body>
</html>
