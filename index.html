<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理实验助手 🔬</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔬 物理实验助手</h1>
        <p>你的专属AI物理实验导师</p>
    </div>
    
    <!-- 直接嵌入扣子智能体分享链接 -->
    <iframe src="https://code.coze.cn/p/7640388575573852169/preview"></iframe>

</html>
